<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial;padding:16px}
#list{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:8px;max-width:420px;margin:auto}
.tile{aspect-ratio:1;background:#101010;border:1px solid #333;color:white;font-size:22px;border-radius:4px;cursor:pointer}
#viewer{display:none}
#back{background:#111;color:white;border:1px solid #444;padding:10px 18px;margin-bottom:10px}
iframe{width:100%;height:85vh;border:0;background:#111}
</style>
</head>
<body>
<div id="list"></div>
<div id="viewer">
<button id="back" onclick="goBack()">←</button>
<iframe id="pdf"></iframe>
</div>
<script>
const files = [
"LAB-MANUAL(7-9).pdf",
"PRACTICAL 1 (implement Single Player Game) (1) - Copy.pdf",
"PRACTICAL 2 (8 Puzzle using DFS).pdf",
"PRACTICAL 3 (Water jug).water jug_",
"PRACTICAL 4 (Travelling Salesman Problem).pdf",
"PRACTICAL 5 (Knowledge base in Prolog).pdf",
"PRACTICAL 6 Travelling Salesman using prolog.pdf"
];
const list=document.getElementById('list');
const viewer=document.getElementById('viewer');
const pdf=document.getElementById('pdf');

files.forEach((file,i)=>{
 const b=document.createElement('button');
 b.className='tile';
 b.textContent=i===0?'7–9':String(i);
 b.onclick=()=>{
   list.style.display='none';
   viewer.style.display='block';
   pdf.src=encodeURI(file)+'#toolbar=0';
 };
 list.appendChild(b);
});
function goBack(){
 pdf.src='';
 viewer.style.display='none';
 list.style.display='grid';
}
</script>
</body>
</html>
